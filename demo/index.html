<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian demo · Lumière Day Spa</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Meridian</span></div>
    <nav aria-label="Main">
      <ul class="nav">
        <li><a href="#overview"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2v12"/></svg>Overview</a></li>
        <li><a href="#plan"><svg viewBox="0 0 16 16"><path d="M2 13l4-4 3 3 5-6"/></svg>Plan and goals</a></li>
        <li><a href="#bookings"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>Bookings</a></li>
        <li><a href="#guests"><svg viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 14c.8-2.8 2.7-4 5-4s4.2 1.2 5 4"/></svg>New guests</a></li>
        <li><a href="#returning"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3"/></svg>Returning guests</a></li>
        <li><a href="#reviews"><svg viewBox="0 0 16 16"><path d="M8 2l1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3 4.3 13.3l.8-4.1L2 6.3l4.2-.5z"/></svg>Reviews</a></li>
        <li><a href="#content"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M2 11l3.5-3.5 3 3L11 8l3 3"/></svg>Content<span class="count" id="approvals-count"></span></a></li>
        <li><a href="#ads"><svg viewBox="0 0 16 16"><path d="M2 10V6l9-3.5v11L2 10zM5 10.8l1 3.2h2l-.8-2.6"/></svg>Ads</a></li>
        <li><a href="#website"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.8 1.7 2.6 3.7 2.6 6S9.8 12.3 8 14C6.2 12.3 5.4 10.3 5.4 8S6.2 3.7 8 2"/></svg>Website</a></li>
        <li><a href="#partners"><svg viewBox="0 0 16 16"><circle cx="5.5" cy="8" r="3.5"/><circle cx="10.5" cy="8" r="3.5"/></svg>Partners</a></li>
      </ul>
    </nav>
    <div class="side-foot"><strong>Managed by Pixel Primed</strong>Questions? contact@pixelprimed.com</div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="venue" id="venue"></div>
      <div class="top-right">
        <span class="sample">Sample data</span>
        <select class="period" aria-label="Time period"><option>Last 30 days</option><option>Last 90 days</option><option>This year</option></select>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../app/demo-data.js"></script>
<script src="../app/app.js"></script>
</body>
</html>
