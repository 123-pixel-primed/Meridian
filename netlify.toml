[build]
  publish = "."
  functions = "netlify/functions"
  # Skip the deploy when only docs/ changed, to save build credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs'"

# Private pages: never indexed, never cached, no referrer passed on.
[[headers]]
  for = "/clients/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/login/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/onboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# The Marketplace app's redirect URL (the app store refuses URLs that name the platform).
[[redirects]]
  from = "/connect/callback"
  to = "/.netlify/functions/ghl-oauth"
  status = 200
  query = { code = ":code" }
