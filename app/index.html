<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Meridian</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .signin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .signin .panel{max-width:420px;width:100%;padding:40px 36px;text-align:center}
  .signin h1{font-family:var(--serif);font-weight:500;font-size:28px;margin:18px 0 8px}
  .signin p{color:var(--label);margin-bottom:24px}
  .signin .brand-mark{margin:0 auto;width:40px;height:40px}
</style>
</head>
<body>
<!-- The live client app connects here once client data is wired in. Until then this page points visitors to the demo. -->
<main class="signin">
  <section class="panel">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Meridian</h1>
    <p>Client sign-in opens soon. In the meantime you can explore the demo with sample data.</p>
    <a class="btn" href="../demo/" style="text-decoration:none;display:inline-block">Explore the demo</a>
  </section>
</main>
</body>
</html>
